<mat-card class="max-w-md mx-auto mt-4 p-4">

  <h2 class="text-xl font-bold mb-2">Signup</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <mat-form-field class="w-full mb-2">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field class="w-full mb-3">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field class="w-full mb-3">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
    </mat-form-field>

    <button mat-raised-button color="accent" class="w-full" [disabled]="loading()">
      {{ loading() ? 'Creating...' : 'Signup' }}
    </button>

    <button mat-raised-button color="accent" class="w-full  mt-5" [routerLink]="['/login']">
      Already Has An Account
    </button>

  </form>

</mat-card>
